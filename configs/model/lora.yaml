# RS-InternVL PEFT / LoRA Production Fine-Tuning Configuration (Step 4)

model:
  backbone: OpenGVLab/InternVL3-1B
  config_file: configs/model/internvl3_1b_config.json
  img_size: 120
  s1_channels: 2
  s1_hidden_dim: 512
  s2_channels: 10
  s2_hidden_dim: 768
  projection_hidden_dim: 1024
  projection_dropout: 0.0
  freeze_s1_encoder: false       # Task-specific, randomly initialized encoder is trainable by default
  freeze_s2_encoder: false       # Task-specific, randomly initialized encoder is trainable by default
  freeze_llm: true              # Base LLM backbone is frozen; only LoRA adapters are trained

lora:
  enabled: true
  r: 8
  alpha: 32
  dropout: 0.1
  bias: none
  target_modules:
    - q_proj
    - v_proj

training:
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  epochs: 20
  mixed_precision: auto         # 'auto', 'fp16', 'bf16', or 'no'
  max_grad_norm: 1.0
  seed: 42
  max_seq_length: 512
  mask_prompt: true
  log_every_n_steps: 1

dataset:
  data_root: data/bigearthnet_txt
  train_manifest: data/manifests/manifest_train.jsonl
  validation_manifest: data/manifests/manifest_validation.jsonl
  max_train_samples: 32         # Real available train split
  max_validation_samples: 8     # Real available validation split
  img_size: 120
  s1_bands:
    - VV
    - VH
  s2_bands:
    - B02
    - B03
    - B04
    - B05
    - B06
    - B07
    - B08
    - B8A
    - B11
    - B12

checkpointing:
  checkpoint_dir: checkpoints/lora
  save_every_epoch: false
  save_best: true
  save_latest: true

output:
  log_dir: outputs/lora
